name: Deploy Web game

on:
  push:
    branches: [main, master, codex/task-395-stasis-migration]
  workflow_dispatch:

concurrency:
  group: toddler-match-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install WebAssembly optimizer
        run: sudo apt-get update && sudo apt-get install --yes binaryen
      - name: Restore pinned Stasis release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-linux-x64.tar.gz -ReleaseTag nightly-20260831-270
      - name: Build verified Web game
        shell: bash
        run: |
          set -euo pipefail
          stasis="${PWD}/.release-toolchain/bin/stasis"
          pwsh ./tools/promote-vector-assets.ps1 -Check
          "${stasis}" fmt --check
          "${stasis}" check
          "${stasis}" test
          "${stasis}" package --target web --out dist/pages
          test -f dist/pages/index.html
          test -f dist/pages/game.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
