name: Quarterly Stasis pin

on:
  # The first day of each quarter is the stable compatibility-pin schedule.
  # This workflow only updates the checked-in pin; the normal weekly release
  # owns the one all-target build after that PR is merged.
  schedule:
    - cron: "17 13 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: toddler-match-quarterly-stasis-pin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      is_quarterly: ${{ steps.calendar.outputs.is_quarterly }}
      stasis_release: ${{ steps.calendar.outputs.stasis_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Select exact quarterly schedule and newest complete Stasis
        id: calendar
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isQuarterly = $env:EVENT_NAME -eq 'schedule' -or $env:EVENT_NAME -eq 'workflow_dispatch'
          "is_quarterly=$($isQuarterly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $releaseId = (./tools/resolve-stasis-nightly.ps1 | Out-String).Trim()
          if ($releaseId -notmatch '^nightly-[0-9]{8}-[0-9]+$') { throw "Unable to resolve a complete Stasis nightly: $releaseId" }
          "stasis_release=$releaseId" >> $env:GITHUB_OUTPUT
          "Quarterly pin candidate: $releaseId" >> $env:GITHUB_STEP_SUMMARY

  pin-update-pr:
    needs: resolve
    if: needs.resolve.outputs.is_quarterly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - name: Prepare dedicated branch from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          git fetch origin automation/quarterly-stasis-pin --depth=1 || true
          git switch -C automation/quarterly-stasis-pin origin/master
      - name: Restore selected Stasis nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-linux-x64.tar.gz -ReleaseTag "${{ needs.resolve.outputs.stasis_release }}"
      - name: Update checked-in Stasis pin and vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "$stasis" vendor update --workspace "$PWD"
          release_id="$(jq -r '.vendor.stasis.release_id' stasis.json)"
          test "$release_id" = '${{ needs.resolve.outputs.stasis_release }}'
          "$stasis" vendor status --workspace "$PWD"
      - name: Create or update dedicated quarterly pin PR
        id: pin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STASIS_RELEASE: ${{ needs.resolve.outputs.stasis_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $unexpected = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Where-Object { $_ -notmatch '^(stasis\.json|vendor/stasis(?:/|$))' })
          if ($unexpected.Count -gt 0) { throw "Quarterly pin update touched unexpected paths: $($unexpected -join ', ')" }
          if (-not (git status --porcelain -- stasis.json vendor/stasis)) {
            'changed=false' >> $env:GITHUB_OUTPUT
            'The checked-in Stasis pin is already current.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $branch = 'automation/quarterly-stasis-pin'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stasis.json vendor/stasis
          git commit -m "chore: pin Stasis $env:STASIS_RELEASE"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          $number = gh pr list --head $branch --base master --state open --json number --jq '.[0].number'
          $body = @"
          Quarterly Stasis pin update was prepared from the newest complete nightly.

          - Pins Stasis to `$env:STASIS_RELEASE`
          - Refreshes `vendor/stasis`
          - Contains no game-source or release-artifact changes
          - The cheap PR gate is dispatched explicitly after this PR is created or updated
          "@
          if ([string]::IsNullOrWhiteSpace($number)) {
            gh pr create --base master --head $branch --title "chore: pin Stasis $env:STASIS_RELEASE" --body $body
          } else {
            gh pr edit $number --title "chore: pin Stasis $env:STASIS_RELEASE" --body $body
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create or update quarterly Stasis pin PR.' }
          'changed=true' >> $env:GITHUB_OUTPUT
      - name: Dispatch cheap pin-branch gate
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pr-stasis-check.yml --ref automation/quarterly-stasis-pin
