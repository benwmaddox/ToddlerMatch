name: PR Stasis check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This is the required, per-push gate. It checks the exact release recorded
# by the PR's stasis.json at the PR head, but leaves the broad test, Web
# packaging, and browser evidence to the local pre-PR command.
jobs:
  stasis-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect shipped or CI changes
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $relevant = @("stasis.json", "vendor/stasis")
            $changedCount = 2
          } else {
            $changed = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA)
            if ($LASTEXITCODE -ne 0) { throw "Unable to compare the pull request base and head" }
            $changedCount = $changed.Count
            $relevant = @($changed | Where-Object {
              $_ -match '^(src|assets|data|vendor/stasis)/' -or
              $_ -in @('stasis.json', '.github/workflows/pr-stasis-check.yml', '.github/workflows/quarterly-stasis.yml') -or
              $_ -match '^tools/(pre-pr-validation|promote-vector-assets|maddox-652-browser-regression)\.(ps1|mjs)$'
            })
          }
          "relevant=$(if ($relevant.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "Changed files: $changedCount; relevant files: $($relevant.Count)." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify current PR head and pinned Stasis policy
        id: stasis_release
        if: steps.changes.outputs.relevant == 'true'
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actualHeadSha = (git rev-parse HEAD).Trim()
          if ($actualHeadSha -ne $env:EXPECTED_HEAD_SHA) {
            throw "Checkout is not the current PR head (expected $env:EXPECTED_HEAD_SHA, actual $actualHeadSha)"
          }
          $project = Get-Content stasis.json -Raw | ConvertFrom-Json
          $releaseId = [string]$project.vendor.stasis.release_id
          $releaseSha = [string]$project.vendor.stasis.sha256
          if ($releaseId -notmatch '^nightly-[0-9]{8}-[0-9]+$') { throw "Invalid pinned Stasis release: $releaseId" }
          if ($releaseSha -notmatch '^[0-9a-fA-F]{64}$') { throw "Invalid pinned Stasis checksum: $releaseSha" }
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "PR head: $actualHeadSha" >> $env:GITHUB_STEP_SUMMARY
          "Pinned Stasis: $releaseId ($releaseSha)" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore repository-pinned Stasis nightly
        if: steps.changes.outputs.relevant == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-linux-x64.tar.gz -ReleaseTag "${{ steps.stasis_release.outputs.release_id }}"

      - name: Validate Stasis project
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "${stasis}" vendor status --workspace "$PWD"
          "${stasis}" fmt --check
          "${stasis}" check
          pwsh ./tools/promote-vector-assets.ps1 -Check

      - name: Required-check sentinel
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No shipped or CI changes; full local pre-PR validation remains required before merge."
