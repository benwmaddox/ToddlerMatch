name: Quarterly Stasis refresh

on:
  # The first day of each quarter keeps this independent from the weekly
  # game-owned release check. It always exercises the newest complete Stasis
  # nightly, even when the game source is unchanged.
  schedule:
    - cron: "17 13 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: toddler-match-quarterly-stasis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stasis_release: ${{ steps.nightly.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve newest complete Stasis nightly
        id: nightly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseId = (./tools/resolve-stasis-nightly.ps1 | Out-String).Trim()
          if ($releaseId -notmatch '^nightly-[0-9]{8}-[0-9]+$') { throw "Unable to resolve a complete Stasis nightly" }
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore newest complete Stasis nightly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-linux-x64.tar.gz -ReleaseTag "${{ needs.resolve.outputs.stasis_release }}"
      - name: Run cheap Linux preflight
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "$stasis" vendor update --workspace "$PWD"
          pwsh ./tools/promote-vector-assets.ps1 -Check
          "$stasis" fmt --check
          "$stasis" check
          "$stasis" test

  desktop:
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: stasis-nightly-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            asset: stasis-nightly-win-x64.zip
          - os: macos-15
            platform: macos
            asset: stasis-nightly-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore newest complete Stasis nightly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/restore-stasis-release.ps1 -AssetName "${{ matrix.asset }}" -ReleaseTag "${{ needs.resolve.outputs.stasis_release }}"
      - name: Build Linux desktop package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "$stasis" vendor update --workspace "$PWD"
          "$stasis" fmt --check
          "$stasis" check
          "$stasis" test
          rm -rf dist/toddler-match-quarterly .stasis_cache
          "$stasis" package --target desktop --out dist/toddler-match-quarterly
          tar -czf "toddler-match-quarterly-${{ needs.resolve.outputs.stasis_release }}-linux-x64.tar.gz" -C dist toddler-match-quarterly
      - name: Build macOS desktop package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "$stasis" vendor update --workspace "$PWD"
          "$stasis" fmt --check
          "$stasis" check
          "$stasis" test
          rm -rf dist/toddler-match-quarterly .stasis_cache
          "$stasis" package --target desktop --out dist/toddler-match-quarterly
          tar -czf "toddler-match-quarterly-${{ needs.resolve.outputs.stasis_release }}-macos-arm64.tar.gz" -C dist toddler-match-quarterly
      - name: Build Windows desktop package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stasis = (Resolve-Path ./.release-toolchain/stasis.exe).Path
          & $stasis vendor update --workspace (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "Stasis vendor update failed" }
          & $stasis fmt --check; if ($LASTEXITCODE -ne 0) { throw "Stasis fmt failed" }
          & $stasis check; if ($LASTEXITCODE -ne 0) { throw "Stasis check failed" }
          & $stasis test; if ($LASTEXITCODE -ne 0) { throw "Stasis test failed" }
          $package = "dist/toddler-match-quarterly"
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Recurse -Force }
          if (Test-Path -LiteralPath .stasis_cache) { Remove-Item -LiteralPath .stasis_cache -Recurse -Force }
          & $stasis package --target desktop --out $package
          if ($LASTEXITCODE -ne 0) { throw "Stasis desktop package failed" }
          Compress-Archive -Path $package -DestinationPath "toddler-match-quarterly-${{ needs.resolve.outputs.stasis_release }}-windows-x64.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: toddler-match-quarterly-desktop-${{ matrix.platform }}
          path: toddler-match-quarterly-*.*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK component installation failed" }
      - name: Restore newest complete Stasis nightly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-win-x64.zip -ReleaseTag "${{ needs.resolve.outputs.stasis_release }}"
          (Resolve-Path ./.release-toolchain).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore pinned Android dependencies
        shell: pwsh
        run: ./tools/restore-android-dependencies.ps1 -StasisPath (Resolve-Path ./.release-toolchain/stasis.exe)
      - name: Restore stable Android debug keystore
        shell: pwsh
        env:
          WEEKLY_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.WEEKLY_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEEKLY_ANDROID_DEBUG_KEYSTORE_BASE64)) { throw "WEEKLY_ANDROID_DEBUG_KEYSTORE_BASE64 is required" }
          $keyPath = Join-Path $env:RUNNER_TEMP "toddler-match-quarterly-debug.keystore"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:WEEKLY_ANDROID_DEBUG_KEYSTORE_BASE64))
          "WEEKLY_ANDROID_DEBUG_KEYSTORE_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and audit Android arm64 APK
        shell: pwsh
        env:
          VERSION: quarterly.${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./tools/build-android-apk.ps1 -StasisPath (Resolve-Path ./.release-toolchain/stasis.exe) -DebugKeystorePath $env:WEEKLY_ANDROID_DEBUG_KEYSTORE_PATH -VersionCode $env:RUN_NUMBER -VersionName $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Android packaging failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: toddler-match-quarterly-android
          path: toddler-match-quarterly.*-android-arm64.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove Android tools, caches, and signing key
        if: always()
        shell: pwsh
        run: |
          @(".release-toolchain", ".stasis_cache", ".gradle-cache", "vendor/android-deps", "dist/android-weekly") | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Remove-Item -LiteralPath $_ -Recurse -Force -ErrorAction SilentlyContinue }
          if ($env:WEEKLY_ANDROID_DEBUG_KEYSTORE_PATH -and (Test-Path -LiteralPath $env:WEEKLY_ANDROID_DEBUG_KEYSTORE_PATH)) { Remove-Item -LiteralPath $env:WEEKLY_ANDROID_DEBUG_KEYSTORE_PATH -Force -ErrorAction SilentlyContinue }

  web:
    needs: [resolve, preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install WebAssembly optimizer
        run: sudo apt-get update && sudo apt-get install --yes binaryen
      - name: Restore newest complete Stasis nightly
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/restore-stasis-release.ps1 -AssetName stasis-nightly-linux-x64.tar.gz -ReleaseTag "${{ needs.resolve.outputs.stasis_release }}"
      - name: Build web package
        shell: bash
        run: |
          set -euo pipefail
          stasis="$PWD/.release-toolchain/bin/stasis"
          "$stasis" vendor update --workspace "$PWD"
          "$stasis" fmt --check
          "$stasis" check
          "$stasis" test
          rm -rf dist/toddler-match-quarterly-web .stasis_cache
          "$stasis" package --target web --out dist/toddler-match-quarterly-web
          pwsh -NoProfile -File tools/apply-branding.ps1 -WebRoot dist/toddler-match-quarterly-web
          tar -czf "toddler-match-quarterly-${{ needs.resolve.outputs.stasis_release }}-web.tar.gz" -C dist toddler-match-quarterly-web
      - uses: actions/upload-artifact@v4
        with:
          name: toddler-match-quarterly-web
          path: toddler-match-quarterly-*-web.tar.gz
          if-no-files-found: error
          retention-days: 7
